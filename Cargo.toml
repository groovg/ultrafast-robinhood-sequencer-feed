[package]
name = "rhfeed"
version = "0.3.0"
edition = "2024"
description = "Decode an Arbitrum Orbit sequencer feed, fast enough to act on it"
license = "Apache-2.0"

[dependencies]
base64-simd = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
log = "0.4"
# libsecp256k1, the same C library coincurve wraps, so the Python baseline and this
# port recover senders with the same code and differ only in what surrounds it.
secp256k1 = { version = "0.33", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
keccak-asm = "0.1"
# Only for secp::FixedKey: point arithmetic to check feed signatures against the known
# key with precomputed tables. libsecp256k1 doesn't expose its point arithmetic.
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# yawc's own TLS stack, set up here so the socket under it can be timed (consume.rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url = "2"
webpki-roots = "1"
# Not tokio-tungstenite: the public feed refuses a handshake without permessage-deflate,
# and tungstenite does not implement it. The zlib feature inflates with zlib-rs, about
# 20% faster than yawc's default miniz_oxide on the feed's frames.
yawc = { version = "0.4", features = ["zlib"] }
sonic-rs = "0.5.10"
rayon = "1.12.0"

[dev-dependencies]
# No features of its own: this is the same flate2 yawc uses, so the benchmark measures
# whichever inflate backend yawc is built with.
flate2 = { version = "1", default-features = false }
futures-util = "0.3"
tokio-tungstenite = "0.30"

[features]
# Recover senders with UltrafastSecp256k1 instead of libsecp256k1. Needs its `ufsecp`
# static library built and UFSECP_LIB_DIR pointing at its build directory; see README.md.
ufsecp = []

[profile.release]
lto = "fat"
codegen-units = 1
