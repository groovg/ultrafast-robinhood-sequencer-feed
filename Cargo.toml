[package]
name = "rhfeed"
version = "0.3.0"
edition = "2024"
description = "Decode an Arbitrum Orbit sequencer feed, fast enough to act on it"
license = "Apache-2.0"

[dependencies]
base64-simd = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"], optional = true }
hex = "0.4"
log = "0.4"
# libsecp256k1, the C library the Python version's coincurve wraps too.
secp256k1 = { version = "0.33", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
keccak-asm = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# yawc's TLS stack, set up here so the socket under it can be timed.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
url = "2"
webpki-roots = "1"
# tungstenite has no client permessage-deflate, which the public feed requires.
# zlib-rs inflates ~20% faster than yawc's default miniz_oxide.
yawc = { version = "0.4", features = ["zlib"] }
# Keeps the inflater warm with busy_poll.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sonic-rs = "0.5.10"
rayon = "1.12.0"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.30"

[features]
# The `rhfeed` command; a library user can drop it with `default-features = false`.
default = ["cli"]
cli = ["dep:clap", "tokio/macros", "tokio/signal"]
# Recover senders with UltrafastSecp256k1. Needs UFSECP_LIB_DIR; see README.md.
ufsecp = []

[profile.release]
lto = "fat"
codegen-units = 1

[[bin]]
name = "rhfeed"
path = "src/main.rs"
required-features = ["cli"]
