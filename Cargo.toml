[package]
name = "rhfeed"
version = "0.3.0"
edition = "2024"
description = "Decode an Arbitrum Orbit sequencer feed, fast enough to act on it"
license = "Apache-2.0"

[dependencies]
base64-simd = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
log = "0.4"
# libsecp256k1, the same C library coincurve wraps, so the Python baseline and this
# port recover senders with the same code and differ only in what surrounds it.
secp256k1 = { version = "0.31", features = ["recovery", "global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
keccak-asm = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# Not tokio-tungstenite: the public feed refuses a handshake without permessage-deflate,
# and tungstenite does not implement it.
yawc = "0.4"
sonic-rs = "0.5.10"
rayon = "1.12.0"
asmcrypto = { version = "0.1.2", optional = true }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = "0.30"

[features]
# Recover senders with UltrafastSecp256k1 instead of libsecp256k1. Needs its `ufsecp`
# static library built and UFSECP_LIB_DIR pointing at its build directory; see README.md.
ufsecp = []
# Recover senders 8 at a time with AVX-512 IFMA (asmcrypto), where the CPU has it.
# Experimental: its author says not to use it in production. tests/golden.rs checks it
# against libsecp256k1 on every signature we have.
asmcrypto = ["dep:asmcrypto"]

[profile.release]
lto = "fat"
codegen-units = 1
